<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build the process · 排列流程</title><link rel="stylesheet" href="lesson.css"></head><body><nav class="nav"><a href="index.html">01 Meet BMI 認識 BMI</a><a class="current" href="process.html">02 Input & Calculate 輸入與計算</a><span>03 If / Else 條件判斷</span></nav><main><div class="buddy"><img src="assets/underweight.png" alt="Friendly classroom mascot"><div><h1>Build the process · 排列流程</h1><p>Click in order · 依序點選：<br><strong>Start 開始 → Input 輸入體重、身高 → Calculate 計算</strong><br>身高與體重可交換順序。</p></div></div><section class="panel"><div class="pieces"><button data-piece="calc">Calculate 計算<br>BMI = kg ÷ (cm ÷ 100)²</button><button data-piece="weight">Input weight 輸入體重<br>kg</button><button data-piece="start">Start 開始</button><button data-piece="height">Input height 輸入身高<br>cm 公分</button></div><div id="process-chain" class="process-chain" aria-label="Process arrangement 流程排列"></div><div id="process-status" class="notice" aria-live="polite"></div><div class="actions"><button id="restart">Restart 重新開始</button></div></section><section id="drawing-step" class="panel drawing-step" hidden><h2>Draw first · 先到 draw.io 繪圖</h2><p>把上方四個方塊畫好，並用箭頭連起來。</p><a class="btn primary" href="https://app.diagrams.net/" target="_blank" rel="noopener">Open draw.io · 開始繪圖 ↗</a><p><label class="confirm"><input id="drawing-done" type="checkbox"> Done · 我已完成前半段流程圖，並接好箭頭。</label></p><button id="next" class="primary" disabled>Next: If / Else · 下一頁 →</button></section></main><dialog id="process-error" aria-labelledby="error-title"><h2 id="error-title">Cannot calculate yet · 還無法計算！</h2><p id="error-message"></p><button id="retry" class="primary" autofocus>Got it, try again · 確認並重新拼圖</button></dialog><script src="process.js"></script></body></html>
