<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build the process · 排列流程</title><link rel="stylesheet" href="lesson.css"></head><body><nav class="nav"><a href="index.html">01 Meet BMI 認識 BMI</a><a class="current" href="process.html">02 Input & Calculate 輸入與計算</a><a href="ifelse.html">03 If / Else 條件判斷</a></nav><main><div class="buddy"><img src="assets/underweight.png" alt="Friendly classroom mascot"><div><h1>Before we decide… · 判斷之前</h1><p>Place four blocks in order · 依序放入四個積木。身高、體重可以交換，但必須先取得兩者才能計算。</p></div></div><section class="panel"><div class="pieces"><button data-piece="calc">Calculate 計算<br>BMI = kg ÷ (cm ÷ 100)²</button><button data-piece="weight">Input weight 輸入體重<br>kg</button><button data-piece="start">Start 開始</button><button data-piece="height">Input height 輸入身高<br>cm 公分</button></div><div id="process-chain" class="process-chain" aria-label="Process arrangement 流程排列"></div><div id="process-status" class="notice" aria-live="polite"></div><div class="actions"><button id="restart">Restart 重新開始</button><button id="next" class="primary" disabled>Next: If / Else 下一頁 →</button></div></section><p class="footer">Oval = Start · 橢圓代表開始　／　Parallelogram = Input · 平行四邊形代表輸入　／　Rectangle = Process · 長方形代表計算</p></main><dialog id="process-error" aria-labelledby="error-title"><h2 id="error-title">Cannot calculate yet · 還無法計算！</h2><p id="error-message"></p><button id="retry" class="primary" autofocus>Got it, try again · 確認並重新拼圖</button></dialog><script src="process.js"></script></body></html>
